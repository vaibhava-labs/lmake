[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lmake-ai"
version = "0.1.0a1"
description = "Local-first change review for LLM-generated artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "lmake prototype contributors"}]
dependencies = ["PyYAML>=6.0"]
keywords = ["llm", "evals", "prompt-engineering", "provenance", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/vaibhava-labs/lmake"
Repository = "https://github.com/vaibhava-labs/lmake"
Issues = "https://github.com/vaibhava-labs/lmake/issues"

[project.optional-dependencies]
litellm = ["litellm>=1.0"]
dspy = ["dspy>=3.0"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.0"]

dev = ["pytest>=8.0", "build>=1.0", "twine>=5.0"]

[project.scripts]
lmake = "lmake.cli:main"

[tool.setuptools]
packages = ["lmake"]

[tool.pytest.ini_options]
markers = [
  "integration_llm: opt-in tests that call real LLM providers and may incur API cost",
]
