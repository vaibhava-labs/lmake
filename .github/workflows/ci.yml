name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e '.[web,dev]'

      - name: Run tests
        run: python -m pytest

      - name: Compile package
        run: python -m compileall lmake

      - name: Smoke test demo project
        run: |
          cd demo_project
          python -m lmake status
          python -m lmake run
          python -m lmake eval critique
          python -m lmake approve critique
          python -m lmake publish --latest -o ../_smoke_publish
          test -f ../_smoke_publish/index.html
          test -f ../_smoke_publish/manifest.json
          test -f ../_smoke_publish/review.json
